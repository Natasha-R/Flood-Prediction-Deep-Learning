architecture: "BranchedUNet"

features: ["dem", "sentinel1", "sentinel2", "soil_bulk_density", "soil_moisture_one_day", "precipitation", "flow_accumulation", "flow_direction", "soil_class", "land_cover", "permanent_water"]

scales: ["local", "context", "basin"]
local_weight: 1
context_weight: 0.25
basin_weight: 0.25

class_weights: [0, 0.775, 1.225]
use_scheduler: False
loss_function: "cross entropy"
number_epochs: 50
learning_rate: 0.0001
dropout: 0.1
weight_decay: 0.0001
batch_size: 32
number_workers: 8

save_model_on_epoch: 5

data_subset_file: "testing_data_subset"