architecture: "BasicUNet"
use_attention_fusion: False
# BasicUNet, ChainedUNet, FusedUNet, FusedBranchedUNet, MultiFusedBranchedUNet

features: ["dem", "flow_direction"]

scales: ["local"]
local_weight: 1
class_weights: [0, 1, 1]
separate_flood_trace_label: False

number_epochs: 5
learning_rate: 0.001
weight_decay: 0

batch_size: 32
number_workers: 8

save_model_on_epoch: 5

data_subset_file: "testing_data_subset"

