architecture: "LocalUNet"

features: ["dem", "flow_accumulation", "precipitation", "sentinel1", "sentinel2", "soil_moisture_one_day", "soil_bulk_density", "soil_class", "permanent_water"]

separate_flood_trace_label: False

number_epochs: 10
learning_rate: 0.001
weight_decay: 0

batch_size: 32
number_workers: 8

save_model_on_epoch: 0
calculate_metrics_on_epoch: 10

data_subset_file: "testing_subset"